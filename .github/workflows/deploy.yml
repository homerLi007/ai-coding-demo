name: Build and Deploy to K3s

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, k3s, local]

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. 手动 checkout（不依赖 actions/checkout）──
      - name: Checkout
        run: |
          cd "$GITHUB_WORKSPACE"
          # 清理工作目录
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          # 浅克隆当前 commit
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout "${GITHUB_SHA}"

      # ── 2. 登录 GHCR（不依赖 docker/login-action）──
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      # ── 3. 构建并推送镜像（不依赖 docker/build-push-action）──
      - name: Build and push image
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_LATEST="${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Building ${IMAGE}"
          docker build -t "${IMAGE}" -t "${IMAGE_LATEST}" .
          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

      # ── 4. 部署到 K3s ──
      - name: Deploy to K3s
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          sed -i "s|image:.*|image: ${IMAGE}|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/ai-coding-demo -n default --timeout=180s
          kubectl get pods -l app=ai-coding-demo -n default -o wide