name: Build and Deploy to K3s

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # homerli007/ai-coding-demo

jobs:
  build-and-deploy:
    # 关键：指定在自托管 Runner 上跑
    runs-on: [self-hosted, k3s, local]

    permissions:
      contents: read
      packages: write    # 推送镜像到 GHCR 需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to K3s
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          # 用 sed 替换 deployment.yaml 里的 image 字段
          sed -i "s|image:.*|image: ${IMAGE}|" k8s/deployment.yaml

          # 应用所有清单
          kubectl apply -f k8s/

          # 等待滚动更新完成
          kubectl rollout status deployment/ai-coding-demo --timeout=180s

          # 输出 Pod 状态
          kubectl get pods -l app=ai-coding-demo -o wide